<main>
  <div class="container">
    <h3 class="mb-3">
      Supa Chat
      <button (click)="logout()" class="btn btn-secondary" style="float: right">Log out</button>
    </h3>
    <div class="card">
      <div>
        @for (message of chats(); track message.id) {
          <div class="col-12 col-lg-12 col-xl-12">
            <div class="position-relative">
              <div class="chat-messages p-4">
                <div class="chat-message-left pb-4">
                  <div class="me-5">
                    <img
                      src="{{ message?.user?.avatar_url }}"
                      alt="Sharon Doe"
                      width="40"
                      height="40"
                    />
                    <div class="text-muted small text-nowrap mt-2">
                      {{ message?.created_at | date: 'M/d/yy, h:mm a' }}
                    </div>
                  </div>
                  <div class="flex-shrink-1 bg-light rounded py-2 px-3 ml-3">
                    <div class="font-weight-bold mb-1">{{ message?.user?.full_name }}</div>
                    {{ message.message }}
                  </div>
                  <div class="dropdown">
                    <span
                      class="mt-3 ms-5"
                      type="button"
                      data-bs-toggle="dropdown"
                      aria-expanded="false"
                      (click)="openDropDown(message)"
                    >
                      ...
                    </span>
                    <ul class="dropdown-menu">
                      <li>
                        <a
                          class="dropdown-item"
                          href="#"
                          data-bs-toggle="modal"
                          data-bs-target="#exampleModal"
                          >Delete</a
                        >
                      </li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          </div>
        } @empty {
          <div>No chats available</div>
        }

        <form [formGroup]="chatForm" (ngSubmit)="onSubmit()">
          <div class="flex-grow-0 py-3 px-4 border-top">
            <div class="input-group">
              <input
                formControlName="chat_message"
                type="text"
                class="form-control"
                placeholder="Type your message"
              />
              <button [disabled]="!chatForm.valid" type="submit" class="btn btn-primary">
                Send
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<app-delete-modal />
